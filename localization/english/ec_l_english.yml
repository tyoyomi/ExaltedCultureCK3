 ec_settings.opt.hybrid_2:0 "Hybrid: Mid (2) — cycle"
 ec_settings.opt.hybrid_3:0 "Hybrid: High (3) — cycle"
 ec_instant_convert_counties_decision:0 "Instant Cultural Conversion"
 ec_instant_convert_counties_decision_desc:0 "As an Exalted Culturalist, instantly convert every county in your sub-realm to your culture. Yearly cooldown."
 ec_instant_convert_counties_decision_tooltip:0 "Set all sub-realm counties to your culture"
 ec_instant_convert_counties_decision_confirm:0 "Convert the Realm"
 ec_instant_convert_counties_decision_effect_tt:0 "All sub-realm counties become your culture"
 ec_tt_instant_convert_ready:0 "You are landed and at least one sub-realm county has a foreign culture"
 ec_master_languages_decision:0 "Master Realm Languages"
 ec_master_languages_decision_desc:0 "Instantly learn every culture language spoken in your sub-realm, and gain permanent language-scheme mastery (more concurrent Learn Language schemes that finish far faster)."
 ec_master_languages_decision_tooltip:0 "Learn all realm culture languages and unlock language mastery"
 ec_master_languages_decision_confirm:0 "Master Them"
 ec_master_languages_decision_effect_tt:0 "You learn realm languages and gain language mastery"
 ec_tt_master_languages_ready:0 "You are a landed Exalted Culturalist"
 ec_language_mastery_modifier:0 "Exalted Language Mastery"
 ec_language_mastery_modifier_desc:0 "You can run many Learn Language schemes at once and finish them much faster."
