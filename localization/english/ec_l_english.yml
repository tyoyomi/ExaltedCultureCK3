 ec_exalted_actions_decision:0 "Exalted Culture: Actions"
 ec_exalted_actions_decision_desc:0 "Open Culture Actions: inspire, convert, languages, paint, undo, or hybrid/diverge express.\n\nDone is always first. Actions on cooldown or gated stay hidden until ready."
 ec_exalted_actions_decision_tooltip:0 "Open Culture Actions for convert, paint, acceptance, languages, and express verbs"
 ec_exalted_actions_decision_confirm:0 "Open Actions"
 ec_exalted_actions_decision_effect_tt:0 "Opens the Exalted Culture Actions hub"

